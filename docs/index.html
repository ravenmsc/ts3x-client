<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="description" content="Interactive TS3X Client App UI Guide. Connecting, channels, voice calls and monitoring.">
        <title>TS3X Client — Interactive UI Guide</title>
        <style>
            :root {
                color-scheme: light;
                --paper: #f6f7f1;
                --white: #fff;
                --ink: #17291f;
                --muted: #4b6054;
                --line: #dce4da;
                --mint: #dbeee0;
                --deep: #104e36;
                --accent: #006843;
                --app: #071b12;
                --surface: #0e2a1d;
                --surface2: #153828;
                --apptext: #e7f5ed;
                --appmuted: #a8c8b8;
                --green: #45c486;
                --soft: #1d5b3e;
                font-family: Geist,Inter,system-ui,sans-serif
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: var(--paper);
                color: var(--ink)
            }

            button,input,textarea,select {
                font: inherit
            }

            button {
                cursor: pointer
            }

            button:disabled {
                cursor: default
            }

            a {
                color: inherit
            }

            button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
                outline: 3px solid #1c9273;
                outline-offset: 3px
            }

            button, a {
                -webkit-tap-highlight-color: transparent
            }

            [hidden] {
                display: none!important
            }

            .icon {
                width: 20px;
                height: 20px;
                display: inline-block;
                vertical-align: middle;
                flex: none
            }

            .wrap {
                max-width: 1220px;
                padding: 0 34px;
                margin: auto
            }

            .top {
                border-bottom: 1px solid var(--line);
                background: #fbfcf7
            }

            .top .wrap {
                height: 73px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px
            }

            .brand,.top-tools,.repository,.mode,.step-meta,.step-actions,.bottom-links {
                display: flex;
                align-items: center
            }

            .brand {
                gap: 11px;
                font-size: 17px;
                font-weight: 780;
                letter-spacing: -.025em;
                text-decoration: none;
                white-space: nowrap
            }

            .brand img {
                width: 36px;
                height: 36px;
                border-radius: 10px
            }

            .brand-divider {
                height: 23px;
                width: 1px;
                background: var(--line);
                margin: 0 4px
            }

            .brand-caption {
                font-size: 13px;
                font-weight: 620;
                letter-spacing: 0;
                color: var(--muted)
            }

            .top-tools {
                gap: 14px
            }

            .lang {
                display: flex;
                gap: 3px;
                background: #ebf0e9;
                padding: 3px;
                border-radius: 100px
            }

            .lang button {
                border: 0;
                background: transparent;
                color: var(--muted);
                border-radius: 100px;
                padding: 5px 9px;
                font-size: 12px;
                font-weight: 760
            }

            .lang button[aria-pressed=true] {
                color: var(--deep);
                background: #fff;
                box-shadow: 0 1px 2px #163c2418
            }

            .repository {
                gap: 7px;
                text-decoration: none;
                border: 1px solid var(--line);
                border-radius: 100px;
                padding: 7px 12px;
                font-size: 13px;
                font-weight: 650
            }

            .repository:hover,.quiet:hover {
                background: #eaf2e9
            }

            .repository .icon {
                width: 16px;
                height: 16px
            }

            .intro {
                padding-top: 36px;
                padding-bottom: 24px
            }

            .eyebrow {
                display: flex;
                gap: 9px;
                align-items: center;
                font-size: 12px;
                font-weight: 760;
                color: var(--deep);
                margin: 0 0 10px
            }

            .eyebrow .icon {
                width: 16px;
                height: 16px
            }

            h1,h2,p {
                margin: 0
            }

            h1 {
                font-size: clamp(35px,5.05vw,65px);
                font-weight: 800;
                letter-spacing: -.065em;
                line-height: 1.04
            }

            .intro p:last-child {
                color: var(--muted);
                font-size: 16px;
                line-height: 1.5;
                margin-top: 12px
            }

            .workspace {
                display: grid;
                grid-template-columns: minmax(0,1fr) minmax(0,1.08fr);
                min-height: 656px;
                border: 1px solid #dce5d9;
                border-radius: 25px;
                overflow: hidden;
                background: #fff;
                box-shadow: 0 18px 45px #203a2510
            }

            .lesson {
                padding: 25px 29px 24px;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 22px
            }

            .navigation {
                display: grid;
                grid-template-columns: repeat(4,minmax(0,1fr));
                gap: 6px
            }

            .chapter {
                position: relative;
                border: 1px solid #e1e8de;
                border-radius: 9px;
                background: #fafbf8;
                color: #385043;
                min-height: 38px;
                padding: 6px 2px;
                font-weight: 680;
                font-size: 11px;
                line-height: 1.2
            }

            .chapter:hover {
                background: #eef6ed
            }

            .chapter[aria-current=step] {
                background: #dcf0e3;
                border-color: #9fcab1;
                color: #14553a
            }

            .chapter[data-done=true]::after {
                content: '✓';
                margin-left: 3px;
                font-size: 10px;
                color: #07754c
            }

            .navigation .chapter:last-child {
                border-style: dashed
            }

            .step-meta {
                justify-content: space-between;
                gap: 10px;
                color: #306047;
                font-weight: 740;
                font-size: 12px
            }

            .mode {
                gap: 5px;
                font-weight: 660;
                color: #4d6253
            }

            .mode .icon {
                width: 15px;
                height: 15px
            }

            .progress {
                display: flex;
                gap: 5px;
                margin: 9px 0 0
            }

            .progress i {
                flex: 1;
                height: 4px;
                background: #e3ece2;
                border-radius: 8px
            }

            .progress i.current {
                background: #80c7a0
            }

            .progress i.past {
                background: #23865c
            }

            .step-copy h2 {
                font-size: clamp(25px,3.15vw,43px);
                letter-spacing: -.052em;
                line-height: 1.04;
                margin: 0 0 12px;
                font-weight: 800
            }

            .step-copy p {
                font-size: 15px;
                line-height: 1.55;
                color: var(--muted);
                max-width: 48ch
            }

            .context {
                font-size: 13px;
                line-height: 1.5;
                color: #3e594a;
                background: #f2f7f0;
                border: 1px solid #e4ece1;
                padding: 11px 12px;
                border-radius: 10px;
                display: flex;
                align-items: flex-start;
                gap: 8px
            }

            .context .icon {
                width: 17px;
                height: 17px;
                margin-top: 1px;
                color: #227553
            }

            .step-actions {
                flex-wrap: wrap;
                gap: 8px;
                min-height: 39px
            }

            .primary,.quiet {
                min-height: 38px;
                padding: 7px 12px;
                display: inline-flex;
                gap: 7px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                font-size: 13px;
                font-weight: 720
            }

            .primary {
                background: #185f43;
                color: #fff;
                border: 1px solid #185f43
            }

            .primary:hover {
                background: #0a4930
            }

            .quiet {
                background: #fff;
                border: 1px solid #dce6dc;
                color: #295340
            }

            .quiet .icon,.primary .icon {
                width: 16px;
                height: 16px
            }

            .lesson-bottom {
                margin-top: auto;
                display: flex;
                flex-direction: column;
                gap: 11px
            }

            .status {
                font-size: 13px;
                color: #43624e;
                min-height: 20px;
                line-height: 1.4
            }

            .status:empty {
                display: none
            }

            .bottom-links {
                padding-top: 13px;
                border-top: 1px solid #e5ebe3;
                justify-content: space-between;
                gap: 8px
            }

            .link-button {
                border: 0;
                background: none;
                color: #3b5948;
                font-size: 12px;
                font-weight: 690;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 5px 0
            }

            .link-button:hover {
                color: #095d3a;
                text-decoration: underline
            }

            .link-button:disabled {
                opacity: .53
            }

            .link-button .icon {
                width: 16px;
                height: 16px
            }

            .stage {
                position: relative;
                min-width: 0;
                isolation: isolate;
                display: grid;
                grid-template-rows: auto 1fr auto;
                justify-items: center;
                align-items: center;
                padding: 14px 24px 12px;
                background-color: #e4eee3;
                background-image: radial-gradient(#9cbba78c .75px,transparent .85px),radial-gradient(ellipse at 50% 42%,#f4f8ec,transparent 72%);
                background-size: 17px 17px,100% 100%;
                border-left: 1px solid #dce5d9
            }

            .stage-top {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                color: #335b47;
                font-size: 11px;
                font-weight: 760
            }

            .stage-current {
                display: none
            }

            .stage-title {
                display: flex;
                align-items: center;
                gap: 6px
            }

            .stage-title .icon {
                width: 16px;
                height: 16px
            }

            .stage-caption {
                color: #466354;
                font-size: 11px;
                text-align: center;
                margin-top: 4px
            }

            .device {
                width: min(100%,330px);
                height: 584px;
                position: relative;
                display: flex;
                flex-direction: column;
                background: var(--app);
                color: var(--apptext);
                border: 7px solid #1a2b24;
                border-radius: 31px;
                margin: 9px 0;
                box-shadow: 0 0 0 1px #788b7f,0 14px 26px #14352239;
                overflow: hidden;
                isolation: isolate;
                color-scheme: dark;
                font-family: Roboto,Arial,sans-serif
            }

            .device :focus-visible {
                outline-color: #83efbd;
                outline-offset: -2px
            }

            .device button {
                color: inherit
            }

            .device.statusless .os,.device.statusless .os-bottom {
                display: none
            }

            .os {
                height: 27px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 14px;
                background: var(--surface);
                font-size: 10px;
                font-weight: 700;
                flex: none
            }

            .os-right {
                display: flex;
                align-items: center;
                gap: 3px
            }

            .os-right .icon {
                width: 12px;
                height: 12px
            }

            .os-bottom {
                height: 15px;
                display: grid;
                place-items: center;
                flex: none;
                background: var(--app);
                z-index: 1
            }

            .os-bottom i {
                width: 78px;
                height: 3px;
                background: #ccdfd3;
                border-radius: 6px
            }

            .device[data-connected=true] .os-bottom {
                background: #131418
            }

            .app-underlay {
                display: flex;
                flex: 1;
                min-height: 0;
                flex-direction: column
            }

            .app-view {
                min-height: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
                position: relative
            }

            .appbar {
                min-height: 52px;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 11px 0 13px;
                background: var(--surface);
                flex: none
            }

            .appbar img {
                width: 30px;
                height: 30px;
                border-radius: 7px
            }

            .appbar strong {
                font-size: 17px;
                letter-spacing: .01em;
                flex: 1
            }

            .app-btn {
                border: 0;
                background: transparent;
                padding: 0;
                display: inline-grid;
                place-items: center;
                border-radius: 50%;
                width: 36px;
                height: 36px;
                flex: none
            }

            .app-btn:hover,.row-action:hover {
                background: #ffffff15
            }

            .app-btn .icon {
                width: 20px;
                height: 20px
            }

            .app-btn:disabled {
                opacity: .45
            }

            .screen-scroll,.modal-body {
                overflow: auto;
                scrollbar-width: thin;
                scrollbar-color: #426c56 transparent;
                overscroll-behavior: contain
            }

            .home {
                padding: 11px 12px;
                flex: 1;
                display: flex;
                flex-direction: column
            }

            .home-head {
                display: grid;
                grid-template-columns: minmax(0,1fr) auto;
                gap: 5px;
                align-items: start
            }

            .home-head h3 {
                margin: 4px 0 4px;
                font-size: 21px;
                letter-spacing: -.025em;
                line-height: 1.12
            }

            .home-head small,.app-note,.server-sub {
                color: var(--appmuted);
                font-size: 11px;
                line-height: 1.4;
                display: block
            }

            .home-buttons {
                display: grid;
                gap: 5px;
                justify-items: end
            }

            .pill {
                background: var(--green);
                color: #052417!important;
                border: 1px solid transparent;
                border-radius: 100px;
                min-height: 33px;
                padding: 4px 10px;
                font-size: 11px;
                font-weight: 700;
                white-space: nowrap
            }

            .pill:hover {
                filter: brightness(1.12)
            }

            .pill.outline {
                background: transparent;
                color: var(--green)!important;
                border-color: #79a58d
            }

            .pill.text {
                background: transparent;
                color: #86dfb0!important
            }

            .app-note {
                background: var(--surface2);
                border-radius: 9px;
                padding: 9px;
                margin: 9px 0
            }

            .empty {
                display: grid;
                align-content: center;
                text-align: center;
                flex: 1;
                padding-bottom: 34px
            }

            .empty strong {
                font-size: 17px;
                font-weight: 600
            }

            .empty small {
                margin-top: 7px;
                line-height: 1.45
            }

            .server-card {
                border-radius: 10px;
                padding: 10px;
                background: var(--surface);
                margin-bottom: 7px
            }

            .server-ident {
                display: flex;
                gap: 8px;
                align-items: center
            }

            .server-ident>div:nth-child(2),.server-ident>div:nth-child(1):not(.server-icon) {
                flex: 1;
                min-width: 0
            }

            .server-ident strong,.server-ident small {
                display: block;
                overflow-wrap: anywhere
            }

            .server-ident strong {
                font-size: 14px
            }

            .server-icon {
                height: 39px;
                width: 39px;
                border-radius: 11px;
                display: grid;
                place-items: center;
                background: #195238;
                color: #a2e3bd;
                font-size: 16px;
                font-weight: 770;
                flex: none
            }

            .server-icon .icon {
                width: 20px;
                height: 20px
            }

            .server-card .server-icon {
                width: 44px;
                height: 44px
            }

            .mon {
                font-size: 11px;
                font-weight: 700;
                color: var(--appmuted);
                flex: none
            }

            .mon.on {
                color: #79e8ac
            }

            .server-card p {
                margin: 5px 0 8px
            }

            .app-actions {
                display: flex;
                gap: 3px
            }

            .app-actions button:first-child {
                flex: 1
            }

            .server-top {
                flex: none;
                padding: 5px 7px 7px 11px;
                background: var(--surface)
            }

            .server-top .app-btn {
                width: 31px;
                height: 33px
            }

            .ChannelDetails {
                min-height: 73px;
                margin: 7px 8px 5px;
                border-radius: 9px;
                background: #153828;
                padding: 10px 45px 10px 11px;
                position: relative;
                flex: none
            }

            .ChannelDetails.practice-art {
                background: radial-gradient(ellipse at 85% 25%,#3c775345,transparent 80%),linear-gradient(145deg,#203e37,#0f261f 72%)
            }

            .ChannelDetails h3 {
                font-size: 16px;
                margin: 0 0 4px
            }

            .ChannelDetails p {
                font-size: 11px;
                line-height: 1.4;
                color: var(--appmuted)
            }

            .ChannelDetails .app-btn {
                position: absolute;
                right: 4px;
                top: 4px;
                color: #89e3b4
            }

            .tree {
                padding: 3px 6px 10px;
                flex: 1
            }

            .channel-wrap {
                display: flex;
                position: relative;
                border-bottom: 1px solid #19392a;
                min-height: 37px;
                border-radius: 4px
            }

            .channel-wrap.active {
                background: #185239
            }

            .channel-wrap.selected {
                background: #143426
            }

            .channel-wrap:nth-child(3n+2):not(.active):not(.selected) {
                background: #ffffff02
            }

            .expand,.row-action,.channel {
                border: 0;
                background: none
            }

            .channel {
                display: flex;
                flex: 1;
                gap: 6px;
                align-items: center;
                min-height: 36px;
                text-align: left;
                padding: 8px 7px 7px 28px;
                font-size: 13px;
                font-weight: 640;
                touch-action: manipulation;
                border-radius: 4px;
                min-width: 0
            }

            .channel:hover {
                background: #ffffff0e
            }

            .channel.nested {
                padding-left: 41px
            }

            .channel .count {
                margin-left: auto;
                color: var(--appmuted);
                font-size: 11px
            }

            .channel .chevron,.tree-mark {
                color: var(--green)
            }

            .channel .icon {
                width: 13px;
                height: 13px
            }

            .expand {
                position: absolute;
                left: 3px;
                top: 3px;
                padding: 0;
                height: 31px;
                width: 22px;
                color: #73dca3!important
            }

            .divider-row {
                font-size: 10px;
                letter-spacing: .11em;
                color: var(--appmuted);
                text-align: center;
                margin: 7px 0 4px
            }

            .member {
                display: flex;
                align-items: center;
                min-height: 32px
            }

            .row-action {
                flex: 1;
                display: flex;
                min-width: 0;
                text-align: left;
                align-items: center;
                gap: 7px;
                border-radius: 4px;
                min-height: 32px;
                padding: 3px 5px 3px 25px;
                font-size: 12px
            }

            .row-action.nested {
                padding-left: 42px
            }

            .avatar {
                width: 23px;
                height: 23px;
                display: grid;
                place-items: center;
                border-radius: 100%;
                background: #31544b;
                color: #c1eddd;
                font-weight: 700;
                font-size: 11px;
                flex: none
            }

            .avatar.speaking {
                outline: 2px solid #66e9a4;
                outline-offset: 0
            }

            .avatar.blue {
                background: #324d66;
                color: #d3e3f6
            }

            .avatar.gold {
                background: #574934;
                color: #f4e6c4
            }

            .member-name {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                flex: 1
            }

            .member .flag {
                background: #25323c;
                border: 1px solid #697c79;
                padding: 1px 4px;
                border-radius: 5px;
                font-size: 10px;
                white-space: nowrap
            }

            .member .app-btn {
                width: 30px;
                height: 29px;
                color: #84d6ac
            }

            .dock-wrap {
                background: #131418;
                padding: 5px 5px 3px;
                flex: none
            }

            .dock {
                background: #202127;
                color: #f3f4f5;
                border-radius: 23px;
                display: flex;
                align-items: center;
                gap: 3px;
                padding: 6px 7px;
                min-height: 51px
            }

            .dock>.avatar {
                width: 31px;
                height: 31px;
                background: #303b39;
                margin-right: 4px
            }

            .dock-copy {
                flex: 1;
                min-width: 0;
                font-size: 11px
            }

            .dock-copy strong,.dock-copy small {
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            .dock-copy small {
                font-size: 9px;
                color: #c0c3cc;
                margin-top: 3px;
                line-height: 1.3
            }

            .dock .app-btn {
                width: 29px;
                height: 32px;
                color: #bbc0c9
            }

            .dock .app-btn .icon {
                height: 17px;
                width: 17px
            }

            .dock .muted,.dock .active-stream {
                color: #f08c97
            }

            .ptt {
                border: 0;
                border-radius: 7px;
                background: #36383f;
                min-width: 52px;
                height: 31px;
                font-size: 11px;
                font-weight: 800;
                touch-action: none;
                user-select: none
            }

            .ptt[aria-pressed=true] {
                background: #45c486;
                color: #061e12
            }

            .meter {
                display: flex;
                align-items: end;
                gap: 2px;
                width: 40px;
                height: 20px
            }

            .meter b {
                width: 3px;
                background: #33895d;
                border-radius: 4px
            }

            .modals {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                z-index: 4;
                background: #020c08a9;
                padding: 13px
            }

            .app-modal {
                background: #153429;
                width: 100%;
                max-height: 91%;
                border-radius: 22px;
                display: flex;
                flex-direction: column;
                box-shadow: 0 8px 25px #0008;
                padding: 16px 13px 8px
            }

            .app-modal.compact {
                width: 89%
            }

            .app-modal.tall {
                max-height: 93%
            }

            .app-modal h3 {
                font-size: 19px;
                font-weight: 600;
                margin: 0 3px 11px
            }

            .modal-body {
                padding: 3px 3px 4px;
                display: grid;
                gap: 11px
            }

            .modal-body .app-note {
                margin: 0
            }

            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 5px;
                margin-top: 7px
            }

            .field {
                display: grid;
                gap: 4px;
                color: var(--appmuted);
                font-size: 10px
            }

            .field input,.field textarea,.field select,.compose input {
                border: 1px solid #7d9a8a;
                background: transparent;
                border-radius: 4px;
                color: var(--apptext);
                padding: 8px 7px;
                width: 100%;
                min-width: 0;
                font-size: 13px
            }

            .field textarea {
                resize: vertical;
                min-height: 56px
            }

            .field input:disabled {
                opacity: .71
            }

            .field small {
                line-height: 1.3;
                font-size: 10px
            }

            .switch-row {
                display: flex;
                align-items: center;
                gap: 7px;
                font-size: 12px;
                line-height: 1.35
            }

            .switch-row small {
                margin-top: 2px
            }

            .switch-row input {
                appearance: none;
                flex: none;
                width: 32px;
                height: 19px;
                margin: 0;
                position: relative;
                border: 1px solid #88a699;
                border-radius: 20px;
                background: #243d33;
                cursor: pointer
            }

            .switch-row input::after {
                content: '';
                position: absolute;
                left: 3px;
                top: 3px;
                border-radius: 50%;
                height: 11px;
                width: 11px;
                background: #a8c8b8
            }

            .switch-row input:checked {
                background: var(--green);
                border-color: var(--green)
            }

            .switch-row input:checked::after {
                left: 16px;
                background: #0a3a25
            }

            .form-error {
                font-size: 11px;
                color: #ffb9b5
            }

            .settings-title {
                margin: 0;
                font-size: 14px;
                border-top: 1px solid #527262;
                padding-top: 8px
            }

            .segment {
                display: flex
            }

            .segment button {
                background: transparent;
                border: 1px solid #7d9a8a;
                padding: 6px;
                font-size: 12px;
                flex: 1;
                border-radius: 0
            }

            .segment button:first-child {
                border-radius: 100px 0 0 100px
            }

            .segment button:last-child {
                border-radius: 0 100px 100px 0
            }

            .segment button[aria-pressed=true] {
                background: #2b684b
            }

            .modal-menu-btn {
                border: 0;
                background: transparent;
                text-align: left;
                border-radius: 6px;
                padding: 7px 5px;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                width: 100%;
                min-height: 34px
            }

            .modal-menu-btn .icon {
                width: 17px;
                height: 17px;
                color: #8bdfb0
            }

            .modal-menu-btn:hover {
                background: #ffffff13
            }

            .slider {
                width: 100%;
                accent-color: var(--green)
            }

            .chat {
                position: absolute;
                inset: 0;
                z-index: 3;
                display: flex;
                flex-direction: column;
                background: var(--app)
            }

            .chat-head {
                background: var(--surface);
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px;
                border-bottom: 1px solid #305344
            }

            .chat-head div {
                flex: 1
            }

            .chat-head strong {
                font-size: 15px
            }

            .chat-log {
                min-height: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;
                overflow: auto;
                padding: 12px 9px
            }

            .chat-log div {
                padding: 7px 9px;
                border-radius: 10px;
                background: #18382b;
                align-self: flex-start;
                max-width: 88%;
                overflow-wrap: anywhere
            }

            .chat-log div.mine {
                background: #1d5b3e;
                align-self: flex-end
            }

            .chat-log b {
                font-size: 10px;
                color: #aef1c9
            }

            .chat-log p {
                font-size: 12px;
                margin-top: 3px
            }

            .compose {
                display: flex;
                gap: 4px;
                padding: 8px
            }

            .compose .app-btn {
                color: var(--green)
            }

            .viewer {
                position: absolute;
                inset: 0;
                z-index: 3;
                background: #030807;
                display: flex;
                flex-direction: column;
                justify-content: center
            }

            .viewer-toggle {
                border: 0;
                padding: 0;
                position: absolute;
                inset: 0;
                background: transparent;
                display: grid;
                place-items: center
            }

            .sample-video {
                display: grid;
                width: 100%;
                aspect-ratio: 16/9;
                padding: 12px;
                grid-template-columns: 1fr 3fr;
                gap: 7px;
                background: #102827;
                text-align: left;
                pointer-events: none
            }

            .sample-video .sample-sidebar {
                background: repeating-linear-gradient(#284c45 0 3px,transparent 3px 10px);
                border-right: 5px solid #102827;
                opacity: .8
            }

            .sample-video .sample-content {
                background: repeating-linear-gradient(90deg,#ffffff0b 0 1px,transparent 1px 15px),repeating-linear-gradient(#ffffff0b 0 1px,transparent 1px 15px),#1c3a32;
                padding: 17px 10px;
                font-size: 15px;
                font-weight: 770;
                color: #caefcf
            }

            .sample-video small {
                display: block;
                margin-top: 4px;
                font-size: 9px;
                color: #a9ceb6
            }

            .viewer-head,.viewer .dock-wrap {
                position: absolute;
                left: 0;
                right: 0
            }

            .viewer-head {
                top: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 7px 9px;
                background: #000a;
                font-size: 12px
            }

            .viewer .dock-wrap {
                bottom: 0
            }

            .toast {
                position: absolute;
                z-index: 6;
                bottom: 7px;
                left: 12px;
                right: 12px;
                background: #e0f3e8;
                color: #123526;
                border-radius: 8px;
                padding: 8px;
                font-size: 11px;
                pointer-events: none
            }

            .hint-target {
                position: relative;
                outline: 2px solid #b0ffcc!important;
                outline-offset: -2px!important;
                box-shadow: 0 0 14px #71ff9f99!important;
                z-index: 1;
                animation: hint-in .35s ease-out
            }

            @keyframes hint-in {
                from {
                    box-shadow: 0 0 0 5px #71ff9f66
                }

                to {
                    box-shadow: 0 0 14px #71ff9f99
                }
            }

            footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 17px 0 24px;
                color: #506557;
                font-size: 11px
            }

            footer a {
                text-decoration: none
            }

            footer a:hover {
                text-decoration: underline
            }

            footer .icon {
                width: 12px;
                height: 12px
            }

            @media(max-width: 900px) {
                .wrap {
                    padding:0 20px
                }

                .lesson {
                    padding: 19px;
                    gap: 16px
                }

                .stage {
                    padding-inline:12px}
            }

            @media(max-width: 690px) {
                .wrap {
                    padding:0 13px
                }

                .top .wrap {
                    height: 59px
                }

                .brand-caption,.brand-divider {
                    display: none
                }

                .top-tools {
                    gap: 7px
                }

                .repository {
                    padding: 5px 8px
                }

                .intro {
                    padding-top: 24px;
                    padding-bottom: 17px
                }

                h1 {
                    letter-spacing: -.055em
                }

                .intro p:last-child {
                    font-size: 14px;
                    margin-top: 8px
                }

                .workspace {
                    grid-template-columns: minmax(0,1fr);
                    border-radius: 17px
                }

                .lesson {
                    display: contents
                }

                .navigation,.step-meta-wrap,.step-copy,.context,.step-actions,.lesson-bottom {
                    grid-column: 1;
                    margin-inline:13px}

                .navigation {
                    margin-top: 12px;
                    grid-row: 1
                }

                .step-meta-wrap {
                    grid-row: 2;
                    margin-top: 11px
                }

                .step-copy {
                    grid-row: 3;
                    margin-top: 12px
                }

                .step-copy h2 {
                    margin-bottom: 6px;
                    font-size: 26px
                }

                .step-copy p {
                    font-size: 14px
                }

                .context {
                    grid-row: 4;
                    margin-top: 9px;
                    font-size: 12px;
                    padding: 7px
                }

                .step-actions {
                    grid-row: 5;
                    margin-top: 6px;
                    margin-bottom: 7px;
                    min-height: 0
                }

                .step-actions button {
                    min-height: 34px
                }

                .lesson-bottom {
                    grid-row: 7;
                    margin-top: 8px;
                    margin-bottom: 9px;
                    gap: 2px
                }

                .bottom-links {
                    padding-top: 4px
                }

                .stage {
                    grid-row: 6;
                    border-left: 0;
                    border-top: 1px solid var(--line);
                    padding-top: 8px;
                    padding-bottom: 8px
                }

                .stage-caption {
                    font-size: 10px
                }

                .device {
                    height: clamp(470px,79svh,560px);
                    margin: 6px 0
                }

                .chapter {
                    min-height: 32px;
                    font-size: 10px
                }

                .stage-top {
                    font-size: 10px
                }

                .stage-current {
                    display: inline;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap
                }

                .stage-title {
                    flex: none
                }

                .stage-badge {
                    display: none
                }

                .stage[data-preview=true] .stage-badge {
                    display: inline;
                    flex: none
                }

                .stage[data-preview=true] .stage-title {
                    display: none
                }

                .workspace.is-complete .step-actions {
                    grid-row: 7;
                    margin-top: 10px
                }

                .workspace.is-complete .lesson-bottom {
                    grid-row: 8
                }

                footer {
                    padding: 11px 1px 18px;
                    line-height: 1.35
                }
            }

            @media(max-width: 355px) {
                .top-tools .repository span {
                    display:none
                }

                .brand {
                    font-size: 15px
                }

                .device {
                    border-width: 5px
                }

                .stage {
                    padding-inline:6px}

                .home {
                    padding-inline:8px}

                .pill {
                    padding-inline:7px}
            }

            @media(prefers-reduced-motion:reduce) {
                *,*::before,*::after {
                    animation: none!important;
                    scroll-behavior: auto!important
                }
            }
        </style>
    </head>
    <body>
        <header class="top">
            <div class="wrap">
                <a class="brand" href="#connect" id="brand">
                    <img alt="" data-logo>
                    <span>TS3X Client</span>
                    <i class="brand-divider" aria-hidden="true"></i>
                    <span class="brand-caption" data-text="brand"></span>
                </a>
                <div class="top-tools">
                    <div class="lang" aria-label="Language">
                        <button type="button" data-lang="ru">RU</button>
                        <button type="button" data-lang="en">EN</button>
                    </div>
                    <a class="repository" href="https://github.com/ravenmsc/ts3x-client" data-icon="github">
                        <span>GitHub</span>
                    </a>
                </div>
            </div>
        </header>
        <main class="wrap">
            <div class="intro">
                <p class="eyebrow" data-icon="android">
                    <span data-text="version"></span>
                </p>
                <h1 data-text="heading"></h1>
                <p data-text="lead"></p>
            </div>
            <div class="workspace">
                <section class="lesson" aria-labelledby="step-title">
                    <nav class="navigation" id="navigation"></nav>
                    <div class="step-meta-wrap">
                        <div class="step-meta">
                            <span id="step-meta" aria-live="polite"></span>
                            <span class="mode" id="step-mode"></span>
                        </div>
                        <div class="progress" id="progress" aria-hidden="true"></div>
                    </div>
                    <div class="step-copy">
                        <h2 id="step-title" tabindex="-1"></h2>
                        <p id="step-description"></p>
                    </div>
                    <div class="context" id="context"></div>
                    <div class="step-actions" id="step-actions"></div>
                    <div class="lesson-bottom">
                        <p class="status" id="status" role="status" aria-atomic="true"></p>
                        <div class="bottom-links" id="bottom-links"></div>
                    </div>
                </section>
                <section class="stage" aria-label="Android simulator">
                    <div class="stage-top">
                        <span class="stage-title" data-icon="smartphone">
                            <span data-text="simulator"></span>
                        </span>
                        <a class="stage-current" id="stage-current" href="#step-title"></a>
                        <span class="stage-badge" id="stage-badge"></span>
                    </div>
                    <div class="device" id="device">
                        <div class="os" aria-hidden="true">
                            <span>14:37</span>
                            <span class="os-right">
                                <span data-icon="wifi"></span>
                                <span data-icon="signal"></span>
                                <span data-icon="battery"></span>
                            </span>
                        </div>
                        <div class="app-view" id="app-view"></div>
                        <div class="os-bottom" aria-hidden="true">
                            <i></i>
                        </div>
                    </div>
                    <p class="stage-caption" data-text="local"></p>
                </section>
            </div>
            <footer>
                <span data-text="footer"></span>
                <a href="https://github.com/ravenmsc/ts3x-client/releases">
                    <span data-text="releases"></span>
                    <span data-icon="external"></span>
                </a>
            </footer>
        </main>

            function getAddress(value, override) {
                const match = value.trim().match(/^(\[[a-f\d:.]+\]|[a-z\d-]+(?:\.[a-z\d-]+)*)(?::(\d{1,5}))?$/i);
                const unbracketed = !match && /^[a-f\d:]+$/i.test(value.trim()) && value.split(':').length > 2 ? value.trim() : '';
                if (!match && !unbracketed)
                    return null;
                const port = match?.[2] || override.trim() || '9987';
                if (!/^\d+$/.test(port) || Number(port) > 65535 || Number(port) < 1)
                    return null;
                const host = (match?.[1] ?? unbracketed).replace(/^\[|\]$/g, '');
                return {
                    host,
                    port: String(Number(port)),
                    embedded: Boolean(match?.[2])
                };
            }
            function parseInvite(value) {
                try {
                    const url = new URL(value.trim());
                    if (url.protocol === 'ts3x:' && url.hostname === 'server' && /^\/add\/?$/.test(url.pathname)) {
                        const encoded = url.searchParams.get('data');
                        if (!encoded || encoded.length > 8192 || [...url.searchParams].length !== 1)
                            return null;
                        const decoded = atob(encoded.replace(/-/g, '+').replace(/_/g, '/'));
                        const invite = JSON.parse(new TextDecoder().decode(Uint8Array.from(decoded, c => c.charCodeAt(0))));
                        const address = getAddress(String(invite.host ?? ''), String(invite.port ?? ''));
                        if (invite.v !== 1 || !address || !Number.isInteger(invite.port) || (invite.name?.length ?? 0) > 256)
                            return null;
                        return {
                            ...sampleProfile(),
                            ...address,
                            name: typeof invite.name === 'string' ? invite.name : ''
                        };
                    }
                    if (url.protocol === 'https:' && ['tmspk.gg', 'www.tmspk.gg'].includes(url.hostname) && url.pathname.startsWith('/s/')) {
                        const address = getAddress(decodeURIComponent(url.pathname.slice(3)), url.searchParams.get('port') ?? '');
                        return address ? {
                            ...sampleProfile(),
                            ...address
                        } : null;
                    }
                } catch {
                    return null;
                }
                return null;
            }

                    selectLesson(Math.max(0, lessonIndex - 1));
                if (action === 'next')
                    selectLesson(Math.min(lessons.length - 1, lessonIndex + 1));
                if (action === 'overview')
                    selectLesson(0);
            }
            );
            app.addEventListener('click', event => {
                const target = event.target.closest('[data-action]');
                if (target && !target.disabled)
                    handleAppAction(target.dataset.action, target);
                if (event.target.matches('[data-backdrop]'))
                    handleAppAction('close-modal');
            }
            );
            app.addEventListener('input', event => updateInput(event.target));
            app.addEventListener('focusout', event => {
                if (event.target.name === 'host' && getAddress(state.draft.host, state.draft.port))
                    advance('valid-host');
                if (event.target.dataset.target === 'ptt' && holdKey)
                    pttChange(false, false);
            }
            );
            app.addEventListener('submit', event => {
                event.preventDefault();
                if (event.target.dataset.form === 'chat')
                    sendChat();
            }
            );
            app.addEventListener('pointerdown', event => {
                const ptt = event.target.closest('[data-target="ptt"]');
                if (!ptt || ptt.disabled || event.button !== 0)
                    return;
                ptt.setPointerCapture(event.pointerId);
                pttChange(true);
            }
            );
            app.addEventListener('pointerup', event => {
                if (event.target.dataset.target === 'ptt')
                    pttChange(false);
            }
            );
            app.addEventListener('pointercancel', () => pttChange(false, false));
            app.addEventListener('lostpointercapture', () => pttChange(false, false));
            app.addEventListener('keydown', event => {
                const target = event.target;
                if (target.dataset.target === 'ptt' && [' ', 'Enter'].includes(event.key)) {
                    event.preventDefault();
                    if (!event.repeat) {
                        holdKey = event.key;
                        pttChange(true);
                    }
                }
                if (event.key === 'Enter' && target.name === 'host') {
                    event.preventDefault();
                    if (getAddress(state.draft.host, state.draft.port))
                        advance('valid-host');
                    else
                        error(str('invalidHost'));
                }
            }
            );
            window.addEventListener('keyup', event => {
                if (event.key === holdKey)
                    pttChange(false);
            }
            );
            window.addEventListener('blur', () => pttChange(false, false));
            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape')
                    return;
                if (state.modal)
                    handleAppAction('close-modal');
                else if (state.chat)
                    handleAppAction('close-chat');
                else if (state.watching)
                    handleAppAction('watch-close');
            }
            );
            node('stage-current').addEventListener('click', event => {
                event.preventDefault();
                node('step-title').focus();
            }
            );
            node('brand').addEventListener('click', event => {
                event.preventDefault();
                selectLesson(0);
            }
            );
            window.addEventListener('hashchange', () => {
                const index = indexFromHash();
                if (index !== lessonIndex)
                    selectLesson(index, false, false);
            }
            );
            resetState();
            updateLocale();
            renderGuide();
            renderApp();
        </script>
    </body>
</html>
