name: Android checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build unsigned release
        run: ./gradlew --no-daemon :protocol:test :ts3j:test :app:lintDebug :app:assembleRelease
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/lint-results-debug.*
            protocol/build/reports/tests/
            ts3j/build/reports/tests/
      - name: Save unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3XClient-0.10.2-542-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
