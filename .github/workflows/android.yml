name: Android checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Keep the runner image stable instead of following ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The hosted runner must provide ANDROID_HOME}"

          # Hosted Ubuntu runners already contain the SDK and accepted licenses.
          # Only install missing packages; never request the obsolete "tools" package.
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ||
                ! -x "$ANDROID_HOME/platform-tools/adb" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager="$(command -v sdkmanager)"
            fi
            "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;34.0.0"
          fi

          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Set up Java for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint and build unsigned release
        id: build
        # Also works when a Windows upload did not preserve gradlew's executable bit.
        run: bash ./gradlew --no-daemon :protocol:test :ts3j:test :app:lintDebug :app:assembleRelease

      - name: Save reports
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: check-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.*
            protocol/build/reports/tests/
            ts3j/build/reports/tests/

      - name: Save unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: TS3XClient-0.10.2-542-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
